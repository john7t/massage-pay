<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>診斷頁 v3</title>
<style>
  body{background:#0a0a0f;color:#e5e7eb;font-family:-apple-system,sans-serif;padding:16px;margin:0;font-size:14px;line-height:1.6}
  h1{font-size:18px;margin:0 0 16px}
  h2{font-size:14px;color:#f59e0b;margin:24px 0 8px;border-bottom:1px solid #333;padding-bottom:4px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #1a1a1f}
  .ok{color:#10b981}
  .fail{color:#ef4444;font-weight:bold}
  .pending{color:#6b7280}
  .detail{font-size:11px;color:#9ca3af;white-space:pre-wrap;word-break:break-all;background:#111;padding:8px;border-radius:6px;margin-top:4px}
  button{background:#d97706;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<h1>🔧 部署診斷頁</h1>
<p id="testTime" style="color:#6b7280;font-size:12px;margin:-8px 0 12px"></p>
<button onclick="location.reload()">重新檢查</button>
<button onclick="copyMarkdown()" style="background:#0891b2">📋 複製診斷結果(Markdown)</button>
<span id="copyMsg" style="font-size:12px;color:#10b981;margin-left:8px"></span>

<h2>1. 主程式檔案版本(直接讀原始文字,不執行,壞了也讀得到)</h2>
<div id="versions">檢查中…</div>

<h2>2. 員工專區 safety-report/ 版本(頁面標題、2 系列 js)</h2>
<p style="font-size:11px;color:#9ca3af;margin:0 0 6px">「頁面宣告」=safety-report/index.html 裡 ?v= 的版號(實際會載入的);「檔頭」=js 檔第一段註解寫的版號(可能沒更新);大小/行數可用來判斷檔案是否上傳完整、是否與預期同一批。</p>
<div id="sr">檢查中…</div>

<h2>3. 逐一載入腳本(找出哪個檔案執行時出錯)</h2>
<div id="loads">尚未開始</div>

<h2>4. 員工專區 2 系列 js 逐一轉譯＋執行(找出哪個檔案出錯)</h2>
<div id="srRun">尚未開始</div>

<script>
const versionsEl = document.getElementById('versions');
const loadsEl = document.getElementById('loads');
window.__diag = { versions: [], loads: [] };

function extractVersion(text, patterns) {
  for (const p of patterns) {
    const m = text.match(p);
    if (m) return m[1];
  }
  return null;
}

async function checkVersions() {
  const files = [
    { name: 'index.html', patterns: [/<title>薪資追蹤\s*v([\d.\-]+)<\/title>/] },
    { name: 'auth.html', patterns: [/<title>薪資追蹤 · 管理\s*v([\d.\-]+)<\/title>/] },
    { name: 'common.js', patterns: [/v(\d+\.\d+-\d+(?:\.\d+)?)\s*\//] },
    { name: 'settings.js', patterns: [/\/\/\s*v(\d+\.\d+-\d+(?:\.\d+)?)\s*\//] },
    { name: 'notice-modal.js', patterns: [/notice-modal\.js\s*v(\d+\.\d+-\d+(?:\.\d+)?)/] },
    { name: 'app-core.js', patterns: [/app-core\.js\s*v(\d+\.\d+-\d+(?:\.\d+)?)/] },
  ];
  let html = '';
  for (const f of files) {
    try {
      const res = await fetch('./' + f.name + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) { html += `<div class="row"><span>${f.name}</span><span class="fail">HTTP ${res.status}</span></div>`; window.__diag.versions.push([f.name, 'HTTP ' + res.status]); continue; }
      const text = await res.text();
      const ver = extractVersion(text, f.patterns);
      html += `<div class="row"><span>${f.name}</span><span class="${ver ? 'ok' : 'fail'}">${ver || '找不到版號'}</span></div>`;
      window.__diag.versions.push([f.name, ver || '找不到版號']);
    } catch (e) {
      html += `<div class="row"><span>${f.name}</span><span class="fail">讀取失敗: ${e.message}</span></div>`;
      window.__diag.versions.push([f.name, '讀取失敗: ' + e.message]);
    }
  }
  // GAS版本(ping)
  try {
    const gasUrl = localStorage.getItem('gas-url');
    if (gasUrl) {
      const res = await fetch(gasUrl + (gasUrl.indexOf('?') >= 0 ? '&' : '?') + 'action=ping');
      const data = await res.json();
      html += `<div class="row"><span>GAS(ping)</span><span class="${data.version ? 'ok' : 'fail'}">${data.version || JSON.stringify(data)}</span></div>`;
      window.__diag.versions.push(['GAS(ping)', data.version || JSON.stringify(data)]);
    } else {
      html += `<div class="row"><span>GAS(ping)</span><span class="pending">本機沒存GAS網址,跳過</span></div>`;
      window.__diag.versions.push(['GAS(ping)', '本機沒存GAS網址,跳過']);
    }
  } catch (e) {
    html += `<div class="row"><span>GAS(ping)</span><span class="fail">${e.message}</span></div>`;
    window.__diag.versions.push(['GAS(ping)', e.message]);
  }
  versionsEl.innerHTML = html;
}

const SR_DIR = './safety-report/';
const SR_JS = ['safety2.js', 'notice2.js', 'blacklist2.js', 'gloves2.js', 'leave2.js', 'my2.js', 'shop2.js', 'counter2.js'];
// 特徵檢查:確認檔案內真的有某版的功能(檔頭版號有時沒跟著改);沒有就代表上傳的是舊檔
const SR_FEATURES = { 'counter2.js': [['還原按鈕(v1.0-014)', 'doReset'], ['iPad 版面(v1.0-015)', 'min-width:900px'], ['先付/交班/結帳(v1.0-012)', 'prepay'], ['日報表(v1.0-012)', 'ReportSheet'], ['訂單詳情時間(v1.0-013)', 'movedAt']] };
 // 載入順序同 safety-report/index.html
async function checkSafetyReport() {
  const el = document.getElementById('sr');
  let html = '';
  window.__diag.sr = [];
  const add = (name, val, cls, extra) => {
    html += `<div class="row"><span>${name}</span><span class="${cls}">${val}</span></div>` + (extra ? `<div class="detail">${extra}</div>` : '');
    window.__diag.sr.push([name, val, extra || '']);
  };
  let pageText = '';
  try {
    const res = await fetch(SR_DIR + 'index.html?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) { add('safety-report/index.html', 'HTTP ' + res.status, 'fail'); el.innerHTML = html; return; }
    pageText = await res.text();
    const tm = pageText.match(/<title>([^<]*)<\/title>/);
    add('index.html 標題', tm ? tm[1] : '找不到標題', tm ? 'ok' : 'fail', '最後修改: ' + (res.headers.get('last-modified') || '(伺服器沒提供)') + '　大小: ' + pageText.length + ' 字元');
  } catch (e) { add('safety-report/index.html', '讀取失敗: ' + e.message, 'fail'); el.innerHTML = html; return; }
  for (const f of SR_JS) {
    try {
      const dm = pageText.match(new RegExp('src="\\./' + f.replace('.', '\\.') + '\\?v=([\\w.\\-]+)"'));
      const declared = dm ? dm[1] : null;
      const res = await fetch(SR_DIR + f + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) { add(f, 'HTTP ' + res.status + (declared ? '(頁面宣告 v' + declared + ')' : ''), 'fail'); continue; }
      const text = await res.text();
      const hm = text.slice(0, 600).match(/v(\d+\.\d+-\d+)/);
      const lines = text.split('\n').length;
      const tail = text.trimEnd().slice(-40).replace(/\s+/g, ' ');
      const msg = `頁面宣告 v${declared || '(沒有)'}　檔頭 v${hm ? hm[1] : '?'}　${(text.length / 1024).toFixed(1)}KB／${lines}行`;
      let extra = '檔尾: …' + tail + '　最後修改: ' + (res.headers.get('last-modified') || '(伺服器沒提供)');
      let cls = declared ? 'ok' : 'fail';
      // 頁面實際會載入的那份(用頁面宣告的 ?v= 網址、走瀏覽器快取)是否和伺服器最新版一致
      if (declared) {
        try {
          const r2 = await fetch(SR_DIR + f + '?v=' + declared);
          const t2 = await r2.text();
          if (t2 !== text) { cls = 'fail'; extra += '<br>⚠ 瀏覽器快取的是舊版(長度 ' + t2.length + ' ≠ 伺服器 ' + text.length + '),請清除網站資料或關掉分頁重開'; }
        } catch (_e) {}
      }
      const feats = SR_FEATURES[f];
      if (feats) {
        const miss = feats.filter(x => text.indexOf(x[1]) < 0).map(x => x[0]);
        extra += '<br>功能檢查: ' + feats.map(x => (text.indexOf(x[1]) >= 0 ? '✓ ' : '✗ ') + x[0]).join('　');
        if (miss.length) { cls = 'fail'; extra += '<br>⚠ 伺服器上的 ' + f + ' 是舊檔(缺:' + miss.join('、') + '),請重新上傳'; }
      }
      add(f, msg, cls, extra);
    } catch (e) { add(f, '讀取失敗: ' + e.message, 'fail'); }
  }
  el.innerHTML = html;
}

// 依序「轉譯＋執行」2 系列 js(順序同頁面,safety2 先),哪個檔案出錯會顯示訊息與行號
function transformFor(source, label) {
  // babel-standalone 對 text/babel 預設 env+react,這裡兩種都試,找出只在其中一種出錯的情況
  const out = {};
  for (const [k, presets] of [['react', [['react', { runtime: 'classic' }]]], ['env+react', ['env', ['react', { runtime: 'classic' }]]]]) {
    try { out[k] = Babel.transform(source, { presets, filename: label }).code; }
    catch (e) { out[k] = null; out[k + '_err'] = e.message; }
  }
  return out;
}
async function checkSafetyReportRun() {
  const box = document.getElementById('srRun');
  let html = '';
  window.__diag.srRun = [];
  const push = (name, msg, ok, detail) => {
    html += `<div class="row"><span>${name}</span><span class="${ok ? 'ok' : 'fail'}">${msg}</span></div>` + (detail ? `<div class="detail">${detail}</div>` : '');
    window.__diag.srRun.push([name, msg, detail || '']);
    box.innerHTML = html;
  };
  if (!window.Babel || !window.React || !window.ReactDOM) { box.innerHTML = '<div class="detail">React/Babel 沒載入成功,略過</div>'; return; }
  try { window.__shownFallback = true; } catch (_e) {} // 診斷頁自己跑腳本時,不要跳出「網站更新中」
  for (const f of SR_JS) {
    let source;
    try {
      const res = await fetch(SR_DIR + f + '?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) { push(f, '✗ HTTP ' + res.status, false); continue; }
      source = await res.text();
    } catch (e) { push(f, '✗ 讀取失敗: ' + e.message, false); continue; }
    const tr = transformFor(source, f);
    const trErr = ['react', 'env+react'].filter(k => !tr[k]).map(k => k + ': ' + tr[k + '_err']).join('\n');
    if (!tr['env+react'] && !tr['react']) { push(f, '✗ 轉譯失敗(語法錯誤)', false, trErr); continue; }
    try {
      const fn = new Function(tr['env+react'] || tr['react']);
      fn();
      push(f, '✓ 轉譯+執行成功' + (trErr ? '(但有一種轉譯失敗,見下)' : ''), !trErr, trErr);
    } catch (e) {
      push(f, '✗ 執行失敗: ' + e.message, false, (e.stack || '').split('\n').slice(0, 6).join('\n'));
    }
  }
}

async function loadScript(src, isModule) {
  return new Promise((resolve) => {
    const el = document.createElement('script');
    el.src = src + '?t=' + Date.now();
    if (isModule) el.type = 'text/babel';
    el.crossOrigin = 'anonymous';
    const timer = setTimeout(() => resolve({ ok: false, msg: '逾時(10秒無回應)' }), 10000);
    el.onload = () => { clearTimeout(timer); resolve({ ok: true }); };
    el.onerror = (e) => { clearTimeout(timer); resolve({ ok: false, msg: '載入失敗(網路或404)' }); };
    document.body.appendChild(el);
  });
}

async function checkBabelScript(url, label) {
  try {
    const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return { ok: false, msg: 'HTTP ' + res.status };
    const source = await res.text();
    let transformed;
    try {
      transformed = Babel.transform(source, { presets: ['react'], filename: label }).code;
    } catch (e) {
      return { ok: false, msg: '【轉譯失敗(語法錯誤)】' + e.message };
    }
    try {
      // 用Function包起來執行,跟babel-standalone實際運作方式一致(同一個全域環境,能存取window.MP/React等)
      const fn = new Function(transformed);
      fn();
    } catch (e) {
      return { ok: false, msg: '【執行失敗】' + e.message + (e.stack ? ('\n' + e.stack.split('\n').slice(0,5).join('\n')) : '') };
    }
    return { ok: true };
  } catch (e) {
    return { ok: false, msg: '讀取失敗: ' + e.message };
  }
}

async function checkLoads() {
  let html = '';
  const errors = [];
  window.addEventListener('error', function (e) {
    errors.push((e.message || 'Script error') + (e.filename ? (' @ ' + e.filename.split('/').pop() + ':' + e.lineno) : ''));
  }, true);

  const cdns = [
    ['React', 'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'],
    ['ReactDOM', 'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js'],
    ['Babel', 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js'],
  ];
  for (const [label, url] of cdns) {
    const r = await loadScript(url, false);
    html += `<div class="row"><span>${label}(CDN)</span><span class="${r.ok ? 'ok' : 'fail'}">${r.ok ? '✓ 載入成功' : '✗ ' + r.msg}</span></div>`;
    window.__diag.loads.push([label + '(CDN)', r.ok ? '✓ 載入成功' : '✗ ' + r.msg, '']);
    loadsEl.innerHTML = html;
    if (!r.ok) { loadsEl.innerHTML += '<div class="detail">CDN載入失敗,後面的檢查會跳過(不影響判斷本機檔案問題)</div>'; return; }
  }

  const errBefore = errors.length;
  const rc = await loadScript('./common.js', false);
  await new Promise(r => setTimeout(r, 300));
  const commonErr = errors.slice(errBefore);
  const commonOk = rc.ok && commonErr.length === 0;
  const commonMsg = rc.ok ? (commonErr.length ? '✗ 執行時出錯' : '✓ 載入+執行成功') : '✗ ' + rc.msg;
  html += `<div class="row"><span>common.js</span><span class="${commonOk ? 'ok' : 'fail'}">${commonMsg}</span></div>`;
  if (commonErr.length) html += `<div class="detail">${commonErr.join('\n')}</div>`;
  window.__diag.loads.push(['common.js', commonMsg, commonErr.join('\n')]);
  loadsEl.innerHTML = html;

  // 額外檢查:window.MP裡有沒有缺函式/缺翻譯鍵(load沒報錯不代表內容完整,常見於檔案沒複製完整)
  if (window.MP) {
    const needFns = ['gasListDisasterSurveys','gasCreateDisasterSurvey','gasEndDisasterSurvey','gasMyDisasterReports','gasDisasterDayStatus','gasCreateGroupBuy','gasListGroupBuys','gasJoinGroupBuy','gasDeclineGroupBuy','gasLogGroupBuyOpen','gasCloseGroupBuy','gasGroupBuyDetail','gasLeaveTeacher','gasVerifyKey','gasRejectAction'];
    const missingFns = needFns.filter(n => typeof window.MP[n] !== 'function');
    const needKeys = ['groupBuyItemGlove','groupBuyItemCustom','groupBuyScopeStore','groupBuyScopeAll','drSurveyNamePh','credentialInvalid','noticeLocalBadge'];
    const T = window.MP.T || {};
    const missingKeysZh = needKeys.filter(k => !(T.zh && T.zh[k]));
    const mpMsg = (missingFns.length === 0 && missingKeysZh.length === 0) ? '✓ 關鍵函式/翻譯鍵齊全' : '✗ 有缺漏(檔案可能沒複製完整)';
    const mpDetail = [
      missingFns.length ? '缺函式: ' + missingFns.join(', ') : '',
      missingKeysZh.length ? '缺翻譯鍵(zh): ' + missingKeysZh.join(', ') : ''
    ].filter(Boolean).join('\n');
    html += `<div class="row"><span>window.MP 完整性</span><span class="${missingFns.length === 0 && missingKeysZh.length === 0 ? 'ok' : 'fail'}">${mpMsg}</span></div>`;
    if (mpDetail) html += `<div class="detail">${mpDetail}</div>`;
    window.__diag.loads.push(['window.MP 完整性', mpMsg, mpDetail]);
    loadsEl.innerHTML = html;
  }

  const rn = await checkBabelScript('./notice-modal.js', 'notice-modal.js');
  const nmMsg = rn.ok ? '✓ 轉譯+執行成功' : '✗ 有問題';
  html += `<div class="row"><span>notice-modal.js</span><span class="${rn.ok ? 'ok' : 'fail'}">${nmMsg}</span></div>`;
  if (!rn.ok) html += `<div class="detail">${rn.msg}</div>`;
  window.__diag.loads.push(['notice-modal.js', nmMsg, rn.msg || '']);
  loadsEl.innerHTML = html;

  const rs = await checkBabelScript('./settings.js', 'settings.js');
  const stMsg = rs.ok ? '✓ 轉譯+執行成功' : '✗ 有問題';
  html += `<div class="row"><span>settings.js</span><span class="${rs.ok ? 'ok' : 'fail'}">${stMsg}</span></div>`;
  if (!rs.ok) html += `<div class="detail">${rs.msg}</div>`;
  window.__diag.loads.push(['settings.js', stMsg, rs.msg || '']);
  loadsEl.innerHTML = html;

  const ra = await checkBabelScript('./app-core.js', 'app-core.js');
  const acMsg = ra.ok ? '✓ 轉譯+執行成功' : '✗ 有問題';
  html += `<div class="row"><span>app-core.js</span><span class="${ra.ok ? 'ok' : 'fail'}">${acMsg}</span></div>`;
  if (!ra.ok) html += `<div class="detail">${ra.msg}</div>`;
  window.__diag.loads.push(['app-core.js', acMsg, ra.msg || '']);
  loadsEl.innerHTML = html;

  html += '<div class="detail" style="margin-top:12px;color:#f59e0b">檢查完成。如果某個檔案顯示✗,上面的詳細內容就是實際錯誤,把這頁的畫面截圖給我即可,或按上面「複製診斷結果」直接貼給我。</div>';
  loadsEl.innerHTML = html;
}

function copyMarkdown() {
  const d = window.__diag;
  let md = '### 部署診斷結果\n\n測試時間：' + new Date().toLocaleString('zh-TW', { hour12: false }) + '\n\n**檔案版本**\n\n';
  d.versions.forEach(([name, ver]) => { md += `- ${name}: \`${ver}\`\n`; });
  md += '\n**safety-report/ 版本**\n\n';
  (d.sr || []).forEach(([name, ver, extra]) => { md += `- ${name}: ${ver}\n`; if (extra) md += `  - ${extra}\n`; });
  md += '\n**2 系列 js 轉譯＋執行**\n\n';
  (d.srRun || []).forEach(([name, status, detail]) => {
    md += `- ${name}: ${status}\n`;
    if (detail) md += '  ```\n  ' + detail.replace(/\n/g, '\n  ') + '\n  ```\n';
  });
  md += '\n**逐一載入腳本**\n\n';
  d.loads.forEach(([name, status, detail]) => {
    md += `- ${name}: ${status}\n`;
    if (detail) md += '  ```\n  ' + detail.replace(/\n/g, '\n  ') + '\n  ```\n';
  });
  md += `\n(裝置: ${navigator.userAgent})\n`;
  const done = () => { document.getElementById('copyMsg').textContent = '✓ 已複製,可以直接貼給我了'; setTimeout(() => { document.getElementById('copyMsg').textContent = ''; }, 3000); };
  const fail = () => {
    // 部分環境(如iOS內嵌webview)clipboard API可能被擋,退而求其次用textarea+execCommand
    try {
      const ta = document.createElement('textarea');
      ta.value = md; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      done();
    } catch (e) { document.getElementById('copyMsg').textContent = '複製失敗,請手動截圖'; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(md).then(done).catch(fail);
  } else { fail(); }
}

document.getElementById('testTime').textContent = '測試時間：' + new Date().toLocaleString('zh-TW', { hour12: false });
checkVersions();
checkSafetyReport();
checkLoads().then(checkSafetyReportRun);
</script>
</body>
</html>
